<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>Ошибка сервера — ТК «Ланской»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap&subset=cyrillic,latin">
<link rel="stylesheet" href="style.css?v=79">
<link rel="stylesheet" href="design.css?v=137">
<link rel="stylesheet" href="design-pages.css?v=160">
<script>(function(){var t;try{t=localStorage.getItem("lns-theme")}catch(e){}
if(!t)t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t);
/* без JS сайт остаётся видимым: класс включает прятание перед появлением */
try{if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("js-rv")}catch(e){}})();</script>
</head>
<body>

<div id="siteHeader" data-active=""></div>

<main id="main" tabindex="-1">

<!-- тот же язык, что у 404: слева сообщение, справа табличка-указатель,
     только вместо маршрутов — как связаться, пока сайт чинят -->
<section class="d404 d500">
  <div class="wrap d404__in">
    <div class="d404__text">
      <p class="rblock__kicker">Ошибка 500</p>
      <h1 class="d404__h1">Что-то сломалось<em>на нашей стороне</em></h1>
      <p class="d404__lead">Это не ваша ошибка. Мы уже знаем о проблеме и чиним. Попробуйте обновить страницу через пару минут.</p>
      <div class="dpromo__acts">
        <button type="button" class="dbtn dbtn--fill" onclick="location.reload()">Обновить страницу</button>
        <a href="design.html" class="dbtn dbtn--ghost d500__home">На главную</a>
      </div>
    </div>
    <div class="dway-wrap">
      <span class="dway__wire dway__wire--l" aria-hidden="true"></span>
      <span class="dway__wire dway__wire--r" aria-hidden="true"></span>
      <div class="dway">
        <div class="dway__here">
          <span class="dway__pin dway__pin--info" aria-hidden="true"></span>
          <span class="dway__here-k">Если нужно срочно</span>
          <span class="dway__here-n">500</span>
          <span class="dway__here-t">Комплекс работает</span>
        </div>
        <a href="tel:+78123630007" class="dway__row">
          <span class="dway__arr dway__arr--phone" aria-hidden="true"></span>
          <span class="dway__name">+7 (812) 363-00-07</span>
          <span class="dway__hint">рецепция</span>
        </a>
        <div class="dway__row">
          <span class="dway__arr dway__arr--clock" aria-hidden="true"></span>
          <span class="dway__name">10:00 — 20:00</span>
          <span class="dway__hint">ежедневно</span>
        </div>
        <div class="dway__row">
          <span class="dway__arr dway__arr--pin" aria-hidden="true"></span>
          <span class="dway__name">Студенческая, 10</span>
          <span class="dway__hint">Санкт-Петербург</span>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<div id="siteFooter"></div>

<div id="siteCookie"></div>

<script src="partials.js?v=76"></script>
<script src="app.js?v=74"></script>
